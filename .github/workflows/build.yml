name: build

on: [push, pull_request]

jobs:
  # The real test: build the compiler on Windows, compile every Wandaa program
  # with nothing but wandaac.exe, run the resulting native binaries, and assert
  # their output. No MinGW is installed in this job -- if anything still needed
  # an assembler or linker at compile time, this job would fail.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build wandaac.exe
        shell: pwsh
        run: |
          # -static so wandaac.exe carries no libstdc++/libgcc DLL dependency and
          # genuinely runs with no toolchain on PATH.
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          g++ -std=c++17 -O2 -Wall -Wextra -static -o bin/wandaac.exe src/lexer.cpp src/parser.cpp src/modules.cpp src/codegen.cpp src/main.cpp
          if ($LASTEXITCODE -ne 0) { exit 1 }
          g++ -std=c++17 -O2 -Wall -Wextra -static -o bin/wandaa.exe src/cli.cpp -lws2_32
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Confirm no assembler or linker is used at compile time
        shell: pwsh
        run: |
          # Compile with PATH stripped down to the system directories, so gcc,
          # as and ld are unreachable. If wandaac still produces a working exe,
          # the toolchain really is self-contained.
          $saved = $env:PATH
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          try {
            .\bin\wandaac.exe examples\gito.waa gito_bare.exe
            if ($LASTEXITCODE -ne 0) { throw "wandaac failed with a bare PATH" }
            $out = (& .\gito_bare.exe | Out-String).Trim()
            if ($out -ne "1") { throw "expected '1', got '$out'" }
            Write-Host "self-contained: compiled and ran with no toolchain on PATH"
          } finally { $env:PATH = $saved }

      - name: Run test suite
        shell: pwsh
        run: .\tests\run_tests.ps1

      # Stage 2 of the bootstrap: the Wandaa lexer has to agree with the C++
      # one token for token, over every .waa file in the repository.
      - name: Wandaa lexer vs C++ lexer
        shell: pwsh
        run: .\compiler\verify_lexer.ps1

      # Stage 2b: the Wandaa parser has to build the same tree as the C++ one.
      - name: Wandaa parser vs C++ parser
        shell: pwsh
        run: .\compiler\verify_parser.ps1

      # Stage 2c: the Wandaa instruction encoder has to emit the same bytes as
      # X64Asm, which run_verify.sh already checks against GNU as.
      - name: Wandaa encoder vs C++ encoder
        shell: pwsh
        run: .\compiler\verify_enc.ps1

      # Stage 2c: the Wandaa PE writer has to build the same image, headers
      # and import block included, as the C++ one.
      - name: Wandaa PE writer vs C++ PE writer
        shell: pwsh
        run: .\compiler\verify_pe.ps1

      # Stage 2c: the Wandaa code generator has to produce byte-identical
      # executables, not merely ones that behave the same.
      - name: Wandaa codegen vs C++ codegen
        shell: pwsh
        run: .\compiler\verify_codegen.ps1

  # Ground-truth checks that need GNU binutils. These gate the two things that
  # cannot be eyeballed: that X64Asm agrees with a real assembler byte-for-byte,
  # and that the checked-in runtime blob still matches runtime.s.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW binutils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils-mingw-w64-x86-64

      - name: Encoder ground truth vs GNU as
        run: ./tools/enc/run_verify.sh

      - name: Standard library docs match lib/
        run: |
          python3 tools/gen_stdlib_docs.py
          if ! git diff --quiet --exit-code docs/isomero.md; then
            echo "::error::docs/isomero.md is stale."
            echo "Regenerate it with: python3 tools/gen_stdlib_docs.py"
            git diff --stat docs/isomero.md
            exit 1
          fi
          echo "stdlib docs are up to date"

      - name: Runtime blob matches runtime.s
        run: |
          ./tools/build_runtime.sh
          if ! git diff --quiet --exit-code include/runtime_blob.hpp; then
            echo "::error::include/runtime_blob.hpp is stale."
            echo "Regenerate it with tools/build_runtime.sh and commit the result."
            git diff --stat include/runtime_blob.hpp
            exit 1
          fi
          echo "runtime blob is up to date"

  # Cross-check the generated executables actually run, on a second platform,
  # via Wine. Catches anything that only shows up at execution time.
  linux-wine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Wine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wine64 wine

      - name: Build wandaac
        run: ./build.sh

      - name: Run test suite under Wine
        run: ./tests/run_tests.sh

      - name: Project and package tool
        run: ./tests/test_cli.sh

