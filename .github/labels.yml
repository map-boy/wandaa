# Issue and pull request labels for Wandaa.
# Apply with:  gh label create -f .github/labels.yml   (or the GitHub UI)

- name: good first issue
  color: "7057ff"
  description: Scoped small and does not need compiler internals knowledge

- name: help wanted
  color: "008672"
  description: Looking for a contributor to pick this up

- name: bug
  color: "d73a4a"
  description: Something in the compiler or runtime is wrong

- name: design-proposal
  color: "5319e7"
  description: A WDP -- language change under discussion (see GOVERNANCE.md)

- name: accepted
  color: "0e8a16"
